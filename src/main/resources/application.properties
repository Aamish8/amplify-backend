spring.application.name=amplify_backend
# PostgreSQL (env vars let you reuse this on Render/Railway)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amplify_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
# JPA (auto-create tables to save time)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Seed data on startup
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2